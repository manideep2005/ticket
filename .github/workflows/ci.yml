name: CI

# Runs on every pull request and on pushes to main so a broken change cannot
# land. Enable "Require status checks to pass" in the main branch protection
# rule to make this gate merging.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Use `npm ci` (not install) so the committed lockfile is authoritative
      # and everyone builds the exact same dependency tree.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
